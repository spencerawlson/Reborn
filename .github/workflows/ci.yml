name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Migrations run against in-process Postgres (PGlite); no DB service needed.
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
        env:
          LIVE_PAYMENTS_ENABLED: "false"
